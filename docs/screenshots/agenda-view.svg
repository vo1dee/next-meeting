  <rect width="144" height="144" fill="#1f7d3a"/>
  <text x="8" y="14" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1" opacity=".7">AGENDA</text>
